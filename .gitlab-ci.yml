image: eclipse-temurin:17-jdk

stages:
  - build
  - test
  - package

gradle-build:
  stage: build
  tags:
    - comp2120
  script:
    - ./gradlew assemble
  artifacts:
    paths:
      - build/

gradle-test:
  stage: test
  tags:
    - comp2120
  script:
    - ./gradlew test
  artifacts:
    when: always
    reports:
      junit:
        - build/test-results/test/TEST-*.xml

# Requires a Docker executor runner with privileged DinD and /certs/client sharing.
docker-package:
  stage: package
  image: docker:27.5.1-cli
  tags:
    - comp2120
  services:
    - name: docker:27.5.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  dependencies: []
  timeout: 20m
  before_script:
    - apk add --no-cache python3
  script:
    - python3 ci/package_smoke.py --image "maze-escape-ci:$CI_COMMIT_SHA"
  after_script:
    - |
      docker ps -aq --filter "label=maze-ci-job=$CI_JOB_ID" | while read -r container; do
        [ -z "$container" ] || docker rm -f "$container"
      done
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - package-logs/
