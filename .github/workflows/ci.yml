name: Build, test and package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew
      - name: Build
        run: ./gradlew --no-daemon assemble

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew
      - name: Run tests
        run: ./gradlew --no-daemon test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: |
            build/test-results/test/
            build/reports/tests/test/

  package:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --progress=plain -t maze-escape-ci:${{ github.sha }} .
      - name: Install Python smoke-test dependency
        run: python3 --version
      - name: Run packaged gameplay checks
        run: python3 ci/package_smoke.py --image maze-escape-ci:${{ github.sha }} --skip-build
      - name: Upload package logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-logs
          path: package-logs/
