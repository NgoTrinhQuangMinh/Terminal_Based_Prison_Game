name: Build, test and package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew
      - name: Build
        run: ./gradlew --no-daemon assemble

  test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew
      - name: Run tests
        run: ./gradlew --no-daemon test runTester
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: |
            build/test-results/test/
            build/reports/tests/test/

  package:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    env:
      SMOKE_JOB_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check Python availability
        run: python3 --version
      - name: Build image and verify packaged gameplay
        run: python3 ci/package_smoke.py --image terminal-prison-game:${{ github.sha }}
      - name: Clean up smoke-test containers
        if: always()
        run: |
          docker ps -aq --filter "label=maze-ci-job=$SMOKE_JOB_ID" | while read -r container; do
            [ -z "$container" ] || docker rm -f "$container"
          done
      - name: Upload package logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-logs
          path: package-logs/
          retention-days: 7
